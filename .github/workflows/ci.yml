name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compile checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        # v3 tries to install the legacy 'tools' package, which Google removed;
        # it broke against the runner image on 2026-09-15. v4 takes an explicit
        # package list, so the NDK/CMake install moves here.
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools ndk;26.3.11579264 cmake;3.22.1"
          accept-android-sdk-licenses: true

      - name: Fetch sherpa-onnx prebuilt (TTS backend)
        # tts_engine.cpp compiles to no-op stubs when this library is absent,
        # and the build still succeeds — so a missing fetch ships a silent,
        # non-functional TTS. Fetch it, then refuse to continue without it.
        run: |
          bash sdk/deviceai-commons/scripts/download-sherpa-onnx.sh android
          for abi in arm64-v8a x86_64; do
            test -f "sdk/deviceai-commons/prebuilt/sherpa-onnx/$abi/libsherpa-onnx-c-api.so" \
              || { echo "::error::sherpa-onnx missing for $abi"; exit 1; }
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile kotlin/core (Android)
        run: ./gradlew :kotlin:core:compileDebugKotlinAndroid --no-daemon

      - name: Compile kotlin/speech (Android)
        run: ./gradlew :kotlin:speech:compileDebugKotlinAndroid --no-daemon

      - name: Compile kotlin/llm (Android)
        run: ./gradlew :kotlin:llm:compileDebugKotlinAndroid --no-daemon

      - name: Compile sample app (Android)
        run: ./gradlew :samples:androidApp:compileDebugKotlin --no-daemon
